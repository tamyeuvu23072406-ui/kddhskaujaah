name: Cập nhật danh sách truyện

on:
  push:
    branches: [main]
    paths:
      - "manga/**"

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tạo lại manga/manifest.json
        run: python3 tools/build_manifest.py

      - name: Commit nếu có thay đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manga/manifest.json
          git diff --cached --quiet && echo "Không có thay đổi." || {
            git commit -m "chore: cập nhật manifest truyện [skip ci]"
            git push
          }
          
